<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BavariaMotion | Angebot anfordern</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0f3d63;       
      --primary-light: #1b5b91;
      --accent: #e67e00;        
      --dark: #12181f;
      --light-bg: #f5f7fa;
      --card-bg: #ffffff;
      --text: #2c3e50;
      --text-muted: #64748b;
      --border: #dbe2ea;
      --radius: 8px;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--light-bg);
      color: var(--text);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background-color: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 0.9rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--primary);
    }
    .brand-logo {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--primary), #2073b5);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 1.25rem;
    }
    .brand-text h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.3px;
    }
    .brand-text span {
      font-size: 0.72rem;
      color: var(--accent);
      font-weight: 700;
    }
    .nav-btn {
      background: transparent;
      border: 1px solid var(--primary);
      padding: 0.65rem 1.2rem;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--primary);
      text-decoration: none;
      border-radius: var(--radius);
      transition: all 0.2s ease;
    }
    .nav-btn:hover {
      background-color: var(--primary);
      color: #fff;
    }
    main {
      flex: 1;
      max-width: 800px;
      width: 100%;
      margin: 4rem auto;
      padding: 0 1.5rem;
    }
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 4rem 2rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      text-align: center;
    }
    .card h2 {
      font-family: 'Montserrat', sans-serif;
      color: var(--primary);
      margin-bottom: 1.5rem;
      font-size: 1.8rem;
    }
    .smiley {
      font-size: 5rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="brand">
      <div class="brand-logo">BM</div>
      <div class="brand-text">
        <h1>BAVARIAMOTION</h1>
        <span>ELEKTROMOTORENWERK PFAFFENHOFEN</span>
      </div>
    </a>
    <a href="index.html" class="nav-btn">Zurück zur Startseite</a>
  </header>

  <main>
    <div class="card">
      <div class="smiley">😉</div>
      <h2>Hey, super dass du so viel Interesse hast und selbst einen Motor kaufen möchtest!</h2>
      <p style="font-size: 1.2rem; margin-top: 1rem; color: var(--text-muted);">
        Doch deine Schule hilft dir gerne dabei einen Motor selbst in Betrieb zu nehmen.
      </p>
      
      <div style="margin-top: 3rem;">
        <a href="index.html" class="nav-btn" style="padding: 1rem 2rem; background: var(--primary); color: white;">Zurück zum Schul-Projekt</a>
      </div>
    </div>
  </main>

</body>
</html>
