<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maschenverfahren - Äußerer Blitzschutz</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            color: #f9a826;
            text-shadow: 0 0 10px rgba(249, 168, 38, 0.5);
            margin-top: 30px;
            text-align: center;
        }
        .container {
            display: flex;
            flex-direction: row;
            gap: 30px;
            margin-top: 20px;
            background-color: #16213e;
            padding: 30px;
            border-radius: 12px;
            border: 2px solid #0f3460;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 900px;
            width: 90%;
        }
        .controls {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .visualization {
            flex: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            background-color: #0f3460;
            border-radius: 8px;
            margin-top: 10px;
        }
        label {
            font-size: 1.1rem;
            color: #a0aab2;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #4a4e69;
            background-color: #1a1a2e;
            color: #ffffff;
            font-size: 1rem;
            margin-top: 5px;
        }
        .result-box {
            background-color: #e94560;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
        }
        .result-box h3 {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
        }
        .result-box p {
            margin: 5px 0;
            font-size: 1.1rem;
            font-weight: bold;
        }
        .back-link {
            margin-top: 30px;
            color: #f9a826;
            text-decoration: none;
            font-size: 1.1rem;
            transition: color 0.3s;
        }
        .back-link:hover {
            color: #ffffff;
        }
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <h1>🕸️ Maschenverfahren</h1>

    <div class="container">
        <div class="controls">
            <div>
                <label for="classSelect">Blitzschutzklasse:</label>
                <select id="classSelect">
                    <option value="5">Klasse I (5 x 5 m)</option>
                    <option value="10">Klasse II (10 x 10 m)</option>
                    <option value="15">Klasse III (15 x 15 m)</option>
                    <option value="20" selected>Klasse IV (20 x 20 m)</option>
                </select>
            </div>
            
            <div>
                <label for="lengthInput">Gebäudelänge a (m):</label>
                <input type="number" id="lengthInput" value="30" min="1" max="200">
            </div>
            
            <div>
                <label for="widthInput">Gebäudebreite b (m):</label>
                <input type="number" id="widthInput" value="20" min="1" max="200">
            </div>

            <div class="result-box">
                <h3>Ergebnis</h3>
                <p>Max. Maschenweite: <span id="resMeshSize">20</span> m</p>
                <p>Anzahl Maschen (a): <span id="resNx">2</span></p>
                <p>Anzahl Maschen (b): <span id="resNy">1</span></p>
                <p>Benötigter Draht (Dach): <span id="resWire">130</span> m</p>
            </div>
        </div>

        <div class="visualization">
            <label>3D Gebäude-Ansicht (Drehbar)</label>
            <canvas id="threeCanvas" width="500" height="400"></canvas>
        </div>
    </div>

    <a href="index.html" class="back-link">⬅ Zurück zur Übersicht</a>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        const classSelect = document.getElementById('classSelect');
        const lengthInput = document.getElementById('lengthInput');
        const widthInput = document.getElementById('widthInput');

        const resMeshSize = document.getElementById('resMeshSize');
        const resNx = document.getElementById('resNx');
        const resNy = document.getElementById('resNy');
        const resWire = document.getElementById('resWire');

        // Three.js Setup
        const canvas = document.getElementById('threeCanvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, canvas.width / canvas.height, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        renderer.setSize(canvas.width, canvas.height);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        scene.add(dirLight);

        let buildingMesh;
        let wireGroup;

        function draw3DHouse(a, b, nx, ny, actualMx, actualMy) {
            if (buildingMesh) scene.remove(buildingMesh);
            if (wireGroup) scene.remove(wireGroup);

            // Adaptive Höhe des Gebäudes, mindestens 5m, maximal 15m
            const h = Math.max(5, Math.min(15, (a + b) / 4));

            // Building (Graues Gebäude)
            const geo = new THREE.BoxGeometry(a, h, b);
            const mat = new THREE.MeshStandardMaterial({ color: '#34495e', roughness: 0.8 });
            buildingMesh = new THREE.Mesh(geo, mat);
            buildingMesh.position.y = h / 2;
            scene.add(buildingMesh);

            // Wire Grid
            wireGroup = new THREE.Group();
            
            // In modern three.js LineBasicMaterial doesn't support linewidth > 1 on Windows,
            // but we use it anyway for simplicity. It's visible enough.
            const wireMatOuter = new THREE.LineBasicMaterial({ color: 0xf9a826 });
            const wireMatInner = new THREE.LineBasicMaterial({ color: 0xf9a826 });

            const roofY = h + 0.1; // knapp über dem Dach
            const startX = -a / 2;
            const startZ = -b / 2;

            // Outer ring
            const outerPoints = [
                new THREE.Vector3(startX, roofY, startZ),
                new THREE.Vector3(startX + a, roofY, startZ),
                new THREE.Vector3(startX + a, roofY, startZ + b),
                new THREE.Vector3(startX, roofY, startZ + b),
                new THREE.Vector3(startX, roofY, startZ)
            ];
            const outerGeo = new THREE.BufferGeometry().setFromPoints(outerPoints);
            wireGroup.add(new THREE.Line(outerGeo, wireMatOuter));

            // Inner lines along Z (parallel to b)
            for (let i = 1; i < nx; i++) {
                const x = startX + i * actualMx;
                const pts = [
                    new THREE.Vector3(x, roofY, startZ),
                    new THREE.Vector3(x, roofY, startZ + b)
                ];
                const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
                wireGroup.add(new THREE.LineSegments(lineGeo, wireMatInner));
            }

            // Inner lines along X (parallel to a)
            for (let i = 1; i < ny; i++) {
                const z = startZ + i * actualMy;
                const pts = [
                    new THREE.Vector3(startX, roofY, z),
                    new THREE.Vector3(startX + a, roofY, z)
                ];
                const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
                wireGroup.add(new THREE.LineSegments(lineGeo, wireMatInner));
            }

            scene.add(wireGroup);

            // Auto fit camera
            const maxDim = Math.max(a, b);
            camera.position.set(maxDim * 0.8, maxDim * 0.6, maxDim * 0.8);
            camera.lookAt(0, h/2, 0);
            controls.target.set(0, h/2, 0);
        }

        function updateSimulation() {
            const m = parseFloat(classSelect.value);
            const a = parseFloat(lengthInput.value);
            const b = parseFloat(widthInput.value);

            if (isNaN(a) || isNaN(b) || a <= 0 || b <= 0) return;

            const nx = Math.ceil(a / m);
            const ny = Math.ceil(b / m);
            
            const actualMx = a / nx;
            const actualMy = b / ny;

            const wireLength = (nx + 1) * b + (ny + 1) * a;

            resMeshSize.innerText = m;
            resNx.innerText = nx;
            resNy.innerText = ny;
            resWire.innerText = wireLength.toFixed(1);

            draw3DHouse(a, b, nx, ny, actualMx, actualMy);
        }

        classSelect.addEventListener('change', updateSimulation);
        lengthInput.addEventListener('input', updateSimulation);
        widthInput.addEventListener('input', updateSimulation);

        updateSimulation();

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
