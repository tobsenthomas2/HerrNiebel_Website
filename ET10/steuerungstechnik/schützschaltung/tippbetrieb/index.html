<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation: Schützschaltung (Tippbetrieb)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .component { transition: all 0.15s ease-in-out; }
        .glow-active { filter: drop-shadow(0 0 12px rgba(250, 204, 21, 1)); }
        .glow-idle { filter: drop-shadow(0 0 12px rgba(34, 197, 94, 0.8)); }
        svg text { font-family: sans-serif; pointer-events: none; user-select: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans p-2 md:p-8">

    <div class="w-full max-w-full mx-auto">
        <!-- Titel -->
        <div class="text-center mb-8">
            <div class="inline-block border border-gray-400 bg-white px-10 py-1 shadow-sm">
                <h1 class="text-2xl font-bold tracking-wide">Tippbetrieb</h1>
            </div>
        </div>

        <!-- Gemeinsamer Schaltplan -->
        <div class="bg-white border border-gray-300 shadow-xl p-2 md:p-10 relative w-full">
            <!-- SVG ist nun voll skalierbar ohne Verzerrung -->
            <svg viewBox="0 0 950 620" class="w-full h-auto" preserveAspectRatio="xMidYMid meet">
                
                <!-- ÜBERSCHRIFTEN -->
                <g text-anchor="middle">
                    <rect x="130" y="15" width="260" height="30" fill="white" stroke="gray" stroke-width="0.5" />
                    <text x="260" y="38" font-size="24" font-weight="normal">Hauptstromkreis</text>

                    <rect x="580" y="15" width="280" height="30" fill="white" stroke="gray" stroke-width="0.5" />
                    <text x="720" y="38" font-size="24" font-weight="normal">Steuerstromkreis</text>
                </g>

                <!-- HAUPTSTROMKREIS -->
                <g stroke="black" stroke-width="2">
                    <line x1="20" y1="80" x2="480" y2="80" /> <text x="5" y="85" font-size="14" stroke="none">L1</text>
                    <line x1="20" y1="110" x2="480" y2="110" /> <text x="5" y="115" font-size="14" stroke="none">L2</text>
                    <line x1="20" y1="140" x2="480" y2="140" /> <text x="5" y="145" font-size="14" stroke="none">L3</text>
                    <line x1="20" y1="170" x2="480" y2="170" /> <text x="5" y="175" font-size="14" stroke="none">N</text>
                    <line x1="20" y1="200" x2="480" y2="200" /> <text x="5" y="205" font-size="14" stroke="none">PE</text>
                </g>

                <!-- Hauptkomponenten -->
                <g transform="translate(180, 80)">
                    <circle cx="0" cy="0" r="3" fill="black" />
                    <circle cx="40" cy="30" r="3" fill="black" />
                    <circle cx="80" cy="60" r="3" fill="black" />
                    
                    <!-- Leitungen von L1-L3 zu F1 -->
                    <line x1="0" y1="0" x2="0" y2="150" stroke="black" stroke-width="1.5" />
                    <line x1="40" y1="30" x2="40" y2="150" stroke="black" stroke-width="1.5" />
                    <line x1="80" y1="60" x2="80" y2="150" stroke="black" stroke-width="1.5" />

                    <!-- F1 Sicherungen mit durchgehendem Strich -->
                    <g transform="translate(0, 150)">
                        <rect x="-10" y="0" width="20" height="50" fill="white" stroke="black" stroke-width="1.5" />
                        <line x1="0" y1="0" x2="0" y2="50" stroke="black" stroke-width="1.5" />
                        
                        <rect x="30" y="0" width="20" height="50" fill="white" stroke="black" stroke-width="1.5" />
                        <line x1="40" y1="0" x2="40" y2="50" stroke="black" stroke-width="1.5" />
                        
                        <rect x="70" y="0" width="20" height="50" fill="white" stroke="black" stroke-width="1.5" />
                        <line x1="80" y1="0" x2="80" y2="50" stroke="black" stroke-width="1.5" />
                        
                        <text x="-35" y="30" font-size="14" font-weight="bold" stroke="none">- F1</text>
                    </g>
                    
                    <!-- Durchgehende Leitungen zwischen F1 und Q1 -->
                    <line x1="0" y1="200" x2="0" y2="240" stroke="black" stroke-width="1.5" />
                    <line x1="40" y1="200" x2="40" y2="240" stroke="black" stroke-width="1.5" />
                    <line x1="80" y1="200" x2="80" y2="240" stroke="black" stroke-width="1.5" />

                    <!-- Q1 Hauptkontakte (Schließer, öffnen nach rechts in Ruhestellung) -->
                    <g transform="translate(0, 240)">
                        <text x="-40" y="30" font-size="14" font-weight="bold" stroke="none">- Q1</text>
                        <g transform="translate(0,0)">
                            <line x1="0" y1="0" x2="0" y2="10" stroke="black" stroke-width="1.5" />
                            <line id="h-c1" x1="0" y1="40" x2="-15" y2="10" stroke="black" stroke-width="1.5" class="component" />
                            <line x1="0" y1="40" x2="0" y2="80" stroke="black" stroke-width="1.5" />
                        </g>
                        <g transform="translate(40,0)">
                            <line x1="0" y1="0" x2="0" y2="10" stroke="black" stroke-width="1.5" />
                            <line id="h-c2" x1="0" y1="40" x2="-15" y2="10" stroke="black" stroke-width="1.5" class="component" />
                            <line x1="0" y1="40" x2="0" y2="80" stroke="black" stroke-width="1.5" />
                        </g>
                        <g transform="translate(80,0)">
                            <line x1="0" y1="0" x2="0" y2="10" stroke="black" stroke-width="1.5" />
                            <line id="h-c3" x1="0" y1="40" x2="-15" y2="10" stroke="black" stroke-width="1.5" class="component" />
                            <line x1="0" y1="40" x2="0" y2="80" stroke="black" stroke-width="1.5" />
                        </g>
                        <g font-size="10" stroke="none">
                            <text x="-12" y="8">1</text> <text x="-12" y="50">2</text>
                            <text x="28" y="8">3</text> <text x="28" y="50">4</text>
                            <text x="68" y="8">5</text> <text x="68" y="50">6</text>
                        </g>
                    </g>
                    
                    <!-- Durchgehende Leitungen zwischen Q1 und Motor (angepasst mit Knick) -->
                    <polyline points="0,320 0,327.6 15,342.6" fill="none" stroke="black" stroke-width="1.5" />
                    <line x1="40" y1="320" x2="40" y2="335" stroke="black" stroke-width="1.5" />
                    <polyline points="80,320 80,327.6 65,342.6" fill="none" stroke="black" stroke-width="1.5" />

                    <!-- Motor M1 -->
                    <g transform="translate(40, 380)">
                        <circle id="motor-circle" cx="0" cy="0" r="45" fill="white" stroke="black" stroke-width="2" class="component" />
                        <text x="0" y="-5" text-anchor="middle" font-size="22" font-weight="bold" stroke="none">M</text>
                        <text x="0" y="15" text-anchor="middle" font-size="14" stroke="none">3~</text>
                    </g>
                    <text x="-40" y="385" font-size="14" font-weight="bold" stroke="none">- M1</text>
                    
                    <!-- PE -->
                    <circle cx="150" cy="120" r="3" fill="black" />
                    <line x1="150" y1="120" x2="150" y2="380" stroke="black" stroke-width="1.5" />
                    <line x1="150" y1="380" x2="85" y2="380" stroke="black" stroke-width="1.5" />
                </g>

                <!-- TRENNUNG -->
                <line x1="500" y1="60" x2="500" y2="580" stroke="#e5e7eb" stroke-width="2" />

                <!-- STEUERSTROMKREIS -->
                <g id="control-circuit">
                    <!-- Schienen -->
                    <line x1="520" y1="80" x2="930" y2="80" stroke="black" stroke-width="2" />
                    <text x="530" y="75" font-size="14">+24 V</text>
                    <line x1="520" y1="540" x2="930" y2="540" stroke="black" stroke-width="2" />
                    <text x="530" y="555" font-size="14">GND</text>

                    <!-- F2 (Ganz links auf Höhe S1/Q1-Spule bei x=600) -->
                    <circle cx="600" cy="80" r="3" fill="black" />
                    <line x1="600" y1="80" x2="600" y2="120" stroke="black" stroke-width="1.5" />
                    <rect x="590" y="120" width="20" height="70" fill="white" stroke="black" stroke-width="1.5" />
                    <!-- Durchgehender Strich in F2 -->
                    <line x1="600" y1="120" x2="600" y2="190" stroke="black" stroke-width="1.5" />
                    <text x="550" y="160" font-size="14" font-weight="bold">- F2</text>
                    <line x1="600" y1="190" x2="600" y2="230" stroke="black" stroke-width="1.5" />

                    <!-- Querverbindung -->
                    <line x1="600" y1="230" x2="840" y2="230" stroke="black" stroke-width="1.5" />
                    <circle cx="600" cy="230" r="3" fill="black" />
                    <circle cx="720" cy="230" r="3" fill="black" />
                    <circle cx="840" cy="230" r="3" fill="black" />

                    <!-- PFAD 1: TASTER -S1 (x=600) -->
                    <g transform="translate(600, 230)">
                        <line x1="0" y1="0" x2="0" y2="30" stroke="black" stroke-width="1.5" />
                        
                        <text x="-60" y="60" font-size="14" font-weight="bold">- S1</text>
                        <text x="-15" y="28" font-size="10">13</text>
                        <text x="-15" y="78" font-size="10">14</text>
                        
                        <!-- Button für S1 (in die Schaltung integriert) -->
                        <foreignObject x="-98" y="32" width="70" height="45">
                            <div xmlns="http://www.w3.org/1999/xhtml" class="w-full h-full">
                                <button 
                                    class="w-full h-full bg-blue-600 text-white rounded shadow-sm hover:bg-blue-700 active:bg-blue-900 active:scale-95 transition-transform flex flex-col items-center justify-center select-none"
                                    style="cursor: pointer;"
                                    onmousedown="toggle(true)"
                                    onmouseup="toggle(false)"
                                    onmouseleave="toggle(false)"
                                    ontouchstart="toggle(true); event.preventDefault();"
                                    ontouchend="toggle(false); event.preventDefault();"
                                >
                                    <span style="font-size: 10px; font-weight: bold;">Taster -S1</span>
                                    <span style="font-size: 7px; line-height: 1.2; text-align: center;" class="text-blue-100 mt-0.5">Gedrückt<br/>halten</span>
                                </button>
                            </div>
                        </foreignObject>

                        <!-- Schließer Mechanik -->
                        <line id="s1-line" x1="0" y1="70" x2="-15" y2="30" stroke="black" stroke-width="1.5" class="component" />
                        <g id="s1-pusher" class="component">
                            <!-- Waagrechter Strich in 2 Segmente unterteilt -->
                            <line x1="-22" y1="50" x2="-16" y2="50" stroke="black" stroke-width="1.5" />
                            <line x1="-13" y1="50" x2="-7.5" y2="50" stroke="black" stroke-width="1.5" />
                            <!-- Senkrechter Strich -->
                            <line x1="-22" y1="42" x2="-22" y2="58" stroke="black" stroke-width="2" />
                        </g>
                        
                        <line x1="0" y1="70" x2="0" y2="170" stroke="black" stroke-width="1.5" />
                        
                        <!-- Spule -Q1 -->
                        <g transform="translate(0, 170)">
                            <rect id="coil-rect" x="-25" y="0" width="50" height="30" fill="white" stroke="black" stroke-width="1.5" class="component" />
                            <text x="-55" y="20" font-size="14" font-weight="bold">- Q1</text>
                            <text x="5" y="-5" font-size="10">A1</text>
                            <text x="5" y="42" font-size="10">A2</text>
                        </g>
                        <line x1="0" y1="200" x2="0" y2="310" stroke="black" stroke-width="1.5" />
                        <circle cx="0" cy="310" r="3" fill="black" />
                    </g>

                    <!-- PFAD 2: SCHLIEßER -Q1 (x=720) -->
                    <g transform="translate(720, 230)">
                        <line x1="0" y1="0" x2="0" y2="30" stroke="black" stroke-width="1.5" />
                        
                        <text x="-40" y="60" font-size="14" font-weight="bold">- Q1</text>
                        <text x="-15" y="28" font-size="10">13</text>
                        <text x="-15" y="78" font-size="10">14</text>
                        
                        <!-- Schließer Mechanik -->
                        <line id="q1-no-line" x1="0" y1="70" x2="-15" y2="30" stroke="black" stroke-width="1.5" class="component" />
                        
                        <line x1="0" y1="70" x2="0" y2="182" stroke="black" stroke-width="1.5" />
                        
                        <!-- Lampe -P1 (MIT Kreuz, Text links) -->
                        <g transform="translate(0, 200)">
                            <circle id="p1-lamp" cx="0" cy="0" r="18" fill="white" stroke="black" stroke-width="1.5" class="component" />
                            <line x1="-12" y1="-12" x2="12" y2="12" stroke="black" stroke-width="1.5" />
                            <line x1="12" y1="-12" x2="-12" y2="12" stroke="black" stroke-width="1.5" />
                            <text x="-35" y="5" font-size="14" font-weight="bold" stroke="none" fill="black" text-anchor="end">- P1</text>
                        </g>
                        <line x1="0" y1="218" x2="0" y2="310" stroke="black" stroke-width="1.5" />
                        <circle cx="0" cy="310" r="3" fill="black" />
                        <text x="0" y="340" font-size="12" text-anchor="middle">Hebebühne</text>
                        <text x="0" y="355" font-size="12" text-anchor="middle">bewegt sich!</text>
                    </g>

                    <!-- PFAD 3: ÖFFNER -Q1 (x=840) -->
                    <g transform="translate(840, 230)">
                        <line x1="0" y1="0" x2="0" y2="30" stroke="black" stroke-width="1.5" />
                        <!-- Kontaktstrich zeigt nach RECHTS (damit Klinge anliegt) -->
                        <line x1="0" y1="30" x2="15" y2="30" stroke="black" stroke-width="1.5" /> 
                        
                        <text x="-40" y="60" font-size="14" font-weight="bold">- Q1</text>
                        <text x="-25" y="28" font-size="10">21</text>
                        <text x="-25" y="78" font-size="10">22</text>
                        
                        <!-- Öffner Mechanik (liegt im Ruhezustand nach rechts gekippt am Kontaktstrich an) -->
                        <line id="q1-nc-line" x1="0" y1="70" x2="15" y2="30" stroke="black" stroke-width="1.5" class="component" />
                        
                        <line x1="0" y1="70" x2="0" y2="182" stroke="black" stroke-width="1.5" />
                        
                        <!-- Lampe -P2 (MIT Kreuz, Text links) -->
                        <g transform="translate(0, 200)">
                            <circle id="p2-lamp" cx="0" cy="0" r="18" fill="#22c55e" stroke="black" stroke-width="1.5" class="component glow-idle" />
                            <line x1="-12" y1="-12" x2="12" y2="12" stroke="black" stroke-width="1.5" />
                            <line x1="12" y1="-12" x2="-12" y2="12" stroke="black" stroke-width="1.5" />
                            <text x="-35" y="5" font-size="14" font-weight="bold" stroke="none" fill="black" text-anchor="end">- P2</text>
                        </g>
                        <line x1="0" y1="218" x2="0" y2="310" stroke="black" stroke-width="1.5" />
                        <circle cx="0" cy="310" r="3" fill="black" />
                        <text x="0" y="340" font-size="12" text-anchor="middle">Hebebühne</text>
                        <text x="0" y="355" font-size="12" text-anchor="middle">steht!</text>
                    </g>
                </g>
            </svg>
        </div>
    </div>

    <script>
        function toggle(active) {
            // Leistungskontakte
            const hc1 = document.getElementById('h-c1');
            const hc2 = document.getElementById('h-c2');
            const hc3 = document.getElementById('h-c3');
            const motorCircle = document.getElementById('motor-circle');
            
            // Steuerkontakte
            const s1 = document.getElementById('s1-line');
            const s1Pusher = document.getElementById('s1-pusher');
            
            const coil = document.getElementById('coil-rect');
            const no = document.getElementById('q1-no-line');
            const nc = document.getElementById('q1-nc-line');
            const p1 = document.getElementById('p1-lamp');
            const p2 = document.getElementById('p2-lamp');

            if (active) {
                // Ein-Zustand: Alle Kontakte bewegen sich nach RECHTS

                // Hauptstrom Schließer werden senkrecht (geschlossen)
                hc1.setAttribute('x2', '0');
                hc2.setAttribute('x2', '0');
                hc3.setAttribute('x2', '0');
                
                // Motor M1 leuchtet auf
                motorCircle.setAttribute('fill', '#facc15');
                motorCircle.classList.add('glow-active');
                
                // Taster S1 Schließer wird senkrecht
                s1.setAttribute('x2', '0');
                // Taster Mechanismus wandert entsprechend nach rechts mit
                s1Pusher.setAttribute('transform', 'translate(7.5, 0)');
                
                coil.setAttribute('fill', '#dcfce7');
                
                // Schließer Q1 schließt (wird senkrecht)
                no.setAttribute('x2', '0');
                
                // Öffner Q1 öffnet nach RECHTS weg vom Kontaktstrich
                nc.setAttribute('x2', '27'); 
                
                // Lampen
                p1.setAttribute('fill', '#facc15');
                p1.classList.add('glow-active');
                p2.setAttribute('fill', 'white');
                p2.classList.remove('glow-idle');
            } else {
                // Aus-Zustand: Alle Kontakte fallen in ihre Ruhestellung (nach links) zurück
                
                hc1.setAttribute('x2', '-15');
                hc2.setAttribute('x2', '-15');
                hc3.setAttribute('x2', '-15');
                
                // Motor M1 geht aus
                motorCircle.setAttribute('fill', 'white');
                motorCircle.classList.remove('glow-active');

                s1.setAttribute('x2', '-15');
                s1Pusher.setAttribute('transform', 'translate(0, 0)');
                
                coil.setAttribute('fill', 'white');
                
                no.setAttribute('x2', '-15');
                
                // Öffner Q1 schließt wieder (fällt nach links an den Kontaktstrich)
                nc.setAttribute('x2', '15'); 
                
                p1.setAttribute('fill', 'white');
                p1.classList.remove('glow-active');
                p2.setAttribute('fill', 'white'); 
                setTimeout(() => p2.setAttribute('fill', '#22c55e'), 50); // Kleiner Delay für optischen Effekt
                p2.classList.add('glow-idle');
            }
        }
    </script>
</body>
</html>
