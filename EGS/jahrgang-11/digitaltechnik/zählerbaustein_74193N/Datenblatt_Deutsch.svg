<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 1123" width="794" height="1123" font-family="Arial, Helvetica, sans-serif">
  <!-- Background -->
  <rect width="794" height="1123" fill="#ffffff"/>

  <!-- Top Header -->
  <text x="744" y="42" text-anchor="end" font-size="22" font-weight="bold" fill="#111111">74193N</text>
  <text x="744" y="68" text-anchor="end" font-size="20" font-weight="bold" fill="#111111">4-BIT SYNCHRONOUS UP/DOWN BINARY COUNTERS</text>
  <text x="744" y="94" text-anchor="end" font-size="10.5" font-weight="bold" fill="#444444">TECHNISCHES REFERENZBLATT · SYNCHRONER 4-BIT VOR-/RÜCKWÄRTSZÄHLER</text>
  <line x1="50" y1="103" x2="744" y2="103" stroke="#111111" stroke-width="3.5"/>

  <!-- BESCHREIBUNG -->
  <text x="65" y="142" font-size="15" font-weight="bold" fill="#111111">BESCHREIBUNG</text>
  <g font-size="13.2" fill="#111111">
    <text x="65" y="166">Der 74193 ist ein universeller, synchroner 4-Bit-Binärzähler, der</text>
    <text x="65" y="187">sowohl vorwärts (Up) als auch rückwärts (Down) zählen kann. Da</text>
    <text x="65" y="208">der Zähler synchron arbeitet, schalten alle Flip-Flops gleichzeitig</text>
    <text x="65" y="229">mit der steigenden Flanke des Taktsignals um. Dies verhindert</text>
    <text x="65" y="250">Schaltspitzen (Glitch-Freiheit), die bei asynchronen Zählern (wie</text>
    <text x="65" y="271">dem 7490) auftreten können. Im Gegensatz zu anderen Zählern</text>
    <text x="65" y="292">besitzt der 74193 getrennte Takteingänge für das Vorwärts- und</text>
    <text x="65" y="313">Rückwärtszählen sowie einen direkten Lösch-Eingang (Clear).</text>
  </g>

  <!-- Pinout Diagram (Top Right, pure vector) -->
  <g transform="translate(555, 132)">
    <!-- IC Body -->
    <rect x="65" y="5" width="60" height="138" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
    <!-- Notch -->
    <path d="M 86 5 A 9 9 0 0 0 104 5" fill="none" stroke="#111111" stroke-width="1.8"/>

    <!-- Left Pins (1..8) -->
    <g stroke="#111111" stroke-width="1.4" fill="#ffffff">
      <rect x="57" y="11" width="8" height="10"/>
      <rect x="57" y="27" width="8" height="10"/>
      <rect x="57" y="43" width="8" height="10"/>
      <rect x="57" y="59" width="8" height="10"/>
      <rect x="57" y="75" width="8" height="10"/>
      <rect x="57" y="91" width="8" height="10"/>
      <rect x="57" y="107" width="8" height="10"/>
      <rect x="57" y="123" width="8" height="10"/>
    </g>
    <!-- Right Pins (16..9) -->
    <g stroke="#111111" stroke-width="1.4" fill="#ffffff">
      <rect x="125" y="11" width="8" height="10"/>
      <rect x="125" y="27" width="8" height="10"/>
      <rect x="125" y="43" width="8" height="10"/>
      <rect x="125" y="59" width="8" height="10"/>
      <rect x="125" y="75" width="8" height="10"/>
      <rect x="125" y="91" width="8" height="10"/>
      <rect x="125" y="107" width="8" height="10"/>
      <rect x="125" y="123" width="8" height="10"/>
    </g>

    <!-- Pin Numbers Inside -->
    <g font-size="10.5" font-weight="bold" fill="#111111">
      <text x="69" y="20">1</text>
      <text x="69" y="36">2</text>
      <text x="69" y="52">3</text>
      <text x="69" y="68">4</text>
      <text x="69" y="84">5</text>
      <text x="69" y="100">6</text>
      <text x="69" y="116">7</text>
      <text x="69" y="132">8</text>

      <text x="121" y="20" text-anchor="end">16</text>
      <text x="121" y="36" text-anchor="end">15</text>
      <text x="121" y="52" text-anchor="end">14</text>
      <text x="121" y="68" text-anchor="end">13</text>
      <text x="121" y="84" text-anchor="end">12</text>
      <text x="121" y="100" text-anchor="end">11</text>
      <text x="121" y="116" text-anchor="end">10</text>
      <text x="121" y="132" text-anchor="end">9</text>
    </g>

    <!-- Pin Labels Left -->
    <g font-size="11.5" font-weight="bold" fill="#111111" text-anchor="end">
      <text x="53" y="20">B</text>
      <text x="53" y="35">Q<tspan dy="2" font-size="9.5">B</tspan></text>
      <text x="53" y="51">Q<tspan dy="2" font-size="9.5">A</tspan></text>
      <text x="53" y="68">DOWN</text>
      <text x="53" y="84">UP</text>
      <text x="53" y="99">Q<tspan dy="2" font-size="9.5">C</tspan></text>
      <text x="53" y="115">Q<tspan dy="2" font-size="9.5">D</tspan></text>
      <text x="53" y="132">GND</text>
    </g>

    <!-- Pin Labels Right -->
    <g font-size="11.5" font-weight="bold" fill="#111111" text-anchor="start">
      <text x="137" y="20">V<tspan dy="2" font-size="9.5">CC</tspan></text>
      <text x="137" y="36">A</text>
      <text x="137" y="52">CLR</text>
      <!-- Overbar for BO -->
      <line x1="137" y1="56" x2="155" y2="56" stroke="#111111" stroke-width="1.3"/>
      <text x="137" y="68">BO</text>
      <!-- Overbar for CO -->
      <line x1="137" y1="72" x2="155" y2="72" stroke="#111111" stroke-width="1.3"/>
      <text x="137" y="84">CO</text>
      <!-- Overbar for LOAD -->
      <line x1="137" y1="88" x2="170" y2="88" stroke="#111111" stroke-width="1.3"/>
      <text x="137" y="100">LOAD</text>
      <text x="137" y="116">C</text>
      <text x="137" y="132">D</text>
    </g>

    <text x="95" y="166" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111111">Pinout Diagramm</text>
  </g>

  <!-- Table Section -->
  <line x1="65" y1="335" x2="730" y2="335" stroke="#111111" stroke-width="2"/>
  <text x="75" y="355" font-size="13" font-weight="bold" fill="#111111">Name</text>
  <text x="300" y="355" font-size="13" font-weight="bold" fill="#111111">Funktion</text>

  <g font-size="12.5" fill="#111111">
    <text x="75" y="381" font-weight="bold">A, B, C, D</text>
    <text x="300" y="381">Dateneingang Bit 1 bis 4 (Für Startwert)</text>

    <text x="75" y="408" font-weight="bold">Q<tspan dy="3" font-size="9.5">A</tspan><tspan dy="-3">, Q</tspan><tspan dy="3" font-size="9.5">B</tspan><tspan dy="-3">, Q</tspan><tspan dy="3" font-size="9.5">C</tspan><tspan dy="-3">, Q</tspan><tspan dy="3" font-size="9.5">D</tspan></text>
    <text x="300" y="408">Datenausgang Bit 1 bis 4</text>

    <text x="75" y="435" font-weight="bold">CLEAR</text>
    <text x="300" y="435">Asynchroner Reset (High = Setzt alle Ausgänge auf Low)</text>

    <text x="75" y="462" font-weight="bold">UP</text>
    <text x="300" y="462">Takteingang Vorwärtszählen (Steigende Flanke)</text>

    <text x="75" y="489" font-weight="bold">DOWN</text>
    <text x="300" y="489">Takteingang Rückwärtszählen (Steigende Flanke)</text>

    <text x="75" y="516" font-weight="bold">~LOAD</text>
    <text x="300" y="516">Daten laden (Low = Lade die Eingänge A–D)</text>

    <text x="75" y="543" font-weight="bold">~CARRY (~CO)</text>
    <text x="300" y="543">Überlauf-Ausgang (Gibt Low-Impuls beim Überlauf von 15 auf 0)</text>

    <text x="75" y="570" font-weight="bold">~BORROW (~BO)</text>
    <text x="300" y="570">Unterlauf-Ausgang (Gibt Low-Impuls beim Unterlauf von 0 auf 15)</text>
  </g>
  <line x1="65" y1="585" x2="730" y2="585" stroke="#111111" stroke-width="2"/>

  <!-- FUNKTIONSWEISE -->
  <text x="68" y="614" font-size="14" font-weight="bold" fill="#111111">FUNKTIONSWEISE</text>
  <g font-size="12.8" fill="#111111">
    <text x="68" y="633"><tspan font-weight="bold">Zählen (Up / Down):</tspan> Der Zähler reagiert auf den Wechsel von Low nach</text>
    <text x="68" y="651">High (steigende Flanke) an den Takteingängen. Um vorwärts zu zählen, wird</text>
    <text x="68" y="669">das Taktsignal an den UP-Eingang angelegt, während der DOWN-Eingang</text>
    <text x="68" y="687">auf High liegen muss.</text>
    <text x="68" y="707">Um rückwärts zu zählen, wird das Taktsignal an den DOWN-Eingang</text>
    <text x="68" y="725">angelegt, während der UP-Eingang auf High liegen muss.</text>

    <text x="68" y="746" font-weight="bold">Laden eines Startwerts (Preset):</text>
    <text x="68" y="764">Durch ein Low-Signal am ~LOAD-Eingang kann ein Startwert übernommen</text>
    <text x="68" y="782">werden. Dafür werden die an den Dateneingängen (A, B, C, D) anliegenden</text>
    <text x="68" y="800">Werte direkt in die Ausgänge (QA, QB, QC, QD) übernommen, und zwar</text>
    <text x="68" y="818">völlig unabhängig vom Taktsignal.</text>

    <text x="68" y="839" font-weight="bold">Zurücksetzen (Clear):</text>
    <text x="68" y="857">Ein High-Signal am CLEAR-Eingang erzwingt sofort an allen Ausgängen eine</text>
    <text x="68" y="875">logische 0. Dies geschieht asynchron, also ohne auf den nächsten Takt zu</text>
    <text x="68" y="893">warten. Der CLEAR-Eingang hat die höchste Priorität.</text>

    <text x="68" y="914" font-weight="bold">Kaskadierung (Erweiterung):</text>
    <text x="68" y="932">Die Ausgänge ~CARRY und ~BORROW dienen dazu, mehrere 74193-</text>
    <text x="68" y="950">Bausteine hintereinander zu schalten (um z. B. bis 255 zu zählen). ~CARRY</text>
    <text x="68" y="968">liefert beim Vorwärtszählen einen Impuls, wenn der Maximalwert (15)</text>
    <text x="68" y="986">überschritten wird. ~BORROW liefert beim Rückwärtszählen einen Impuls,</text>
    <text x="68" y="1004">wenn Null unterschritten wird.</text>
  </g>

  <!-- Logic Symbol (Bottom Right, pure vector) -->
  <g transform="translate(595, 672)">
    <!-- Outer Box -->
    <rect x="35" y="0" width="98" height="192" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
    <!-- Horizontal Divider between control and data flip-flops -->
