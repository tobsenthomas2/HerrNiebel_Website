      <line x1="133" y1="60" x2="160" y2="60"/>

      <line x1="133" y1="104" x2="160" y2="104"/>
      <line x1="133" y1="129" x2="160" y2="129"/>
      <line x1="133" y1="154" x2="160" y2="154"/>
      <line x1="133" y1="179" x2="160" y2="179"/>
    </g>

    <!-- Pin Numbers on Lines -->
    <g font-family="Courier New, monospace" font-size="11" font-weight="bold" fill="#111111">
      <text x="10" y="19">14</text>
      <text x="10" y="35">11</text>
      <text x="10" y="57">5</text>
      <text x="10" y="71">4</text>
      <text x="10" y="101">15</text>
      <text x="10" y="126">1</text>
      <text x="10" y="151">10</text>
      <text x="10" y="176">9</text>

      <text x="140" y="19">12</text>
      <text x="140" y="57">13</text>
      <text x="140" y="101">3</text>
      <text x="140" y="126">2</text>
      <text x="140" y="151">6</text>
      <text x="140" y="176">7</text>
    </g>

    <!-- Inside Labels -->
    <g font-family="Courier New, monospace" font-size="11" fill="#111111">
      <text x="44" y="26">CLR</text>
      <text x="44" y="42">~LOAD</text>
      <text x="46" y="64">UP</text>
      <text x="46" y="78">DOWN</text>

      <text x="42" y="108">A</text>
      <text x="42" y="133">B</text>
      <text x="42" y="158">C</text>
      <text x="42" y="183">D</text>

      <text x="125" y="26" text-anchor="end">~CO</text>
      <text x="125" y="64" text-anchor="end">~BO</text>
      <text x="125" y="108" text-anchor="end">QA</text>
      <text x="125" y="133" text-anchor="end">QB</text>
      <text x="125" y="158" text-anchor="end">QC</text>
      <text x="125" y="183" text-anchor="end">QD</text>
    </g>

    <text x="84" y="216" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">74193N</text>
    <text x="84" y="246" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111111">Logic Symbol</text>
  </g>

  <!-- Legal / Educational Footer (No third-party trademarks) -->
  <line x1="50" y1="1032" x2="744" y2="1032" stroke="#111111" stroke-width="3"/>
  <g font-size="9.5" fill="#333333">
    <text x="50" y="1049" font-weight="bold" fill="#111111">DIDAKTISCHES REFERENZBLATT · DIGITALTECHNIK LABOR (74193N)</text>
    <text x="50" y="1063">Eigene Zusammenstellung der technischen Standard-Kennwerte für Unterrichtszwecke (herrniebel.de).</text>
