      <line x1="8" y1="38" x2="35" y2="38"/>
      <line x1="8" y1="60" x2="35" y2="60"/>
      <line x1="8" y1="74" x2="35" y2="74"/>

      <line x1="8" y1="104" x2="35" y2="104"/>
      <line x1="8" y1="129" x2="35" y2="129"/>
      <line x1="8" y1="154" x2="35" y2="154"/>
      <line x1="8" y1="179" x2="35" y2="179"/>
    </g>

    <!-- Clock Triangles on Pins 5 and 4 -->
    <polyline points="35,55 42,60 35,65" fill="none" stroke="#111111" stroke-width="1.2"/>
    <polyline points="35,69 42,74 35,79" fill="none" stroke="#111111" stroke-width="1.2"/>

    <!-- Right Output Lines -->
    <g stroke="#111111" stroke-width="1.3">
