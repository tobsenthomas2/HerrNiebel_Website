      <text x="121" y="116" text-anchor="end">10</text>
      <text x="121" y="132" text-anchor="end">9</text>
    </g>

    <!-- Pin Labels Left -->
    <g font-size="11.5" font-weight="bold" fill="#111111" text-anchor="end">
      <text x="53" y="20">B</text>
      <text x="53" y="35">Q<tspan dy="2" font-size="9.5">B</tspan></text>
      <text x="53" y="51">Q<tspan dy="2" font-size="9.5">A</tspan></text>
      <text x="53" y="68">DOWN</text>
