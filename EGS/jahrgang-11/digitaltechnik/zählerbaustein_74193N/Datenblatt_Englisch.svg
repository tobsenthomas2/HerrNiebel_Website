      <rect x="125" y="27" width="8" height="10"/>
      <rect x="125" y="43" width="8" height="10"/>
      <rect x="125" y="59" width="8" height="10"/>
      <rect x="125" y="75" width="8" height="10"/>
      <rect x="125" y="91" width="8" height="10"/>
