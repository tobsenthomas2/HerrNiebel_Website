      <text x="69" y="52">3</text>
      <text x="69" y="68">4</text>
      <text x="69" y="84">5</text>
      <text x="69" y="100">6</text>
      <text x="69" y="116">7</text>
      <text x="69" y="132">8</text>

      <text x="121" y="20" text-anchor="end">16</text>
