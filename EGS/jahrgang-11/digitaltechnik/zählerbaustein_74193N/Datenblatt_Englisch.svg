  <!-- Table Section -->
  <line x1="65" y1="335" x2="730" y2="335" stroke="#111111" stroke-width="2"/>
  <text x="75" y="355" font-size="13" font-weight="bold" fill="#111111">Name</text>
  <text x="308" y="355" font-size="13" font-weight="bold" fill="#111111">Function</text>

  <g font-size="12.5" fill="#111111">
    <text x="75" y="381" font-weight="bold">A, B, C, D</text>
    <text x="308" y="381">Data input bits 1 to 4 (for start value)</text>

    <text x="75" y="408" font-weight="bold">Q<tspan dy="3" font-size="9.5">A</tspan><tspan dy="-3">, Q</tspan><tspan dy="3" font-size="9.5">B</tspan><tspan dy="-3">, Q</tspan><tspan dy="3" font-size="9.5">C</tspan><tspan dy="-3">, Q</tspan><tspan dy="3" font-size="9.5">D</tspan></text>
    <text x="308" y="408">Data output bits 1 to 4</text>

    <text x="75" y="435" font-weight="bold">CLEAR</text>
    <text x="308" y="435">Asynchronous reset (High = sets all outputs to Low)</text>

    <text x="75" y="462" font-weight="bold">UP</text>
    <text x="308" y="462">Clock input counting up (rising edge)</text>

    <text x="75" y="489" font-weight="bold">DOWN</text>
    <text x="308" y="489">Clock input counting down (rising edge)</text>

    <text x="75" y="516" font-weight="bold">~LOAD</text>
    <text x="308" y="516">Load data (Low = load inputs A–D)</text>

    <text x="75" y="543" font-weight="bold">~CARRY (~CO)</text>
    <text x="308" y="543">Overflow output (gives low-impulse when overflowing from 15 to 0)</text>

    <text x="75" y="570" font-weight="bold">~BORROW (~BO)</text>
    <text x="308" y="570">Underflow output (gives low-impulse when underflowing from 0 to 15)</text>
  </g>
  <line x1="65" y1="585" x2="730" y2="585" stroke="#111111" stroke-width="2"/>

  <!-- FUNCTIONALITY -->
  <text x="68" y="614" font-size="14" font-weight="bold" fill="#111111">FUNCTIONALITY</text>
  <g font-size="12.8" fill="#111111">
    <text x="68" y="633"><tspan font-weight="bold">Counting (Up / Down):</tspan> The counter responds to a transition from low to</text>
    <text x="68" y="651">high (rising edge) at the clock inputs. To count upwards, the clock signal</text>
    <text x="68" y="669">must be applied to the UP-input while the DOWN-input must remain at</text>
    <text x="68" y="687">high.</text>
    <text x="68" y="707">To count backward, the clock signal must be applied to the DOWN-input</text>
    <text x="68" y="725">while the UP-input must remain at high.</text>

    <text x="68" y="746" font-weight="bold">Loading a start value (Preset):</text>
    <text x="68" y="764">A start value can be adopted through a low signal at the ~LOAD input. To do</text>
    <text x="68" y="782">this, the values present at the data inputs (A, B, C, D) are transferred</text>
    <text x="68" y="800">directly to the outputs (QA, QB, QC, QD), completely independent of the</text>
    <text x="68" y="818">clock signal.</text>

    <text x="68" y="839" font-weight="bold">Reset (Clear):</text>
    <text x="68" y="857">A High-signal at the CLEAR-input immediately forces all outputs to a logical</text>
    <text x="68" y="875">0. This occurs asynchronously, meaning the counter does not wait for the</text>
    <text x="68" y="893">next clock pulse. The CLEAR-input has the highest priority.</text>

    <text x="68" y="914" font-weight="bold">Cascading (Extension):</text>
    <text x="68" y="932">The ~CARRY and ~BORROW outputs are used to connect several 74193</text>
    <text x="68" y="950">modules in a row (e.g., to count up to 255). ~CARRY generates an impulse</text>
    <text x="68" y="968">during upward counting when the maximum value (15) is exceeded.</text>
    <text x="68" y="986">~BORROW generates an impulse during downward counting when the</text>
    <text x="68" y="1004">counter goes below zero.</text>
  </g>

  <!-- Logic Symbol (Bottom Right, pure vector) -->
